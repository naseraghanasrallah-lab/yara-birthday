<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Karam</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(135deg, #fff, #f3d8e3);

      font-family: Arial, sans-serif;
      text-align: center;
      color: #55323f;
    }

    .card {
      width: 85%;
      max-width: 600px;

      padding: 45px 25px;

      background: rgba(255,255,255,0.9);

      border-radius: 25px;

      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    }

    h1 {
      margin: 0 0 25px;

      font-size: 70px;

      color: #b85c78;
    }

    button {
      padding: 14px 30px;

      border: none;
      border-radius: 30px;

      background: #b85c78;
      color: white;

      font-size: 18px;

      cursor: pointer;
    }

    #message {
      margin-top: 35px;

      font-size: 32px;

      font-weight: bold;

      color: #8f3f5c;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Karam</h1>

    <button id="open">
      افتح الرسالة 🤍
    </button>

    <div id="message" class="hidden">
      طوووبز جحشش
    </div>

  </div>

  <script>
    const button = document.getElementById("open");
    const message = document.getElementById("message");

    button.addEventListener("click", function() {
      message.classList.remove("hidden");
      button.style.display = "none";
    });
  </script>

</body>
</html>
